services:
  init-perms:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/logs /data/postgres && chown -R 65532:65532 /data && chown -R 999:999 /data/postgres"]
    volumes:
      - ./data:/data
    restart: "no"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://inventory:${DB_PASSWORD:-inventory}@db:5432/inventory
      - SECRET_KEY=${SECRET_KEY:-dev-secret-do-not-use-in-production}
      - TZ=${TZ:-UTC}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-16}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/login')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=inventory
      - POSTGRES_PASSWORD=${DB_PASSWORD:-inventory}
    restart: always
    depends_on:
      init-perms:
        condition: service_completed_successfully
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
