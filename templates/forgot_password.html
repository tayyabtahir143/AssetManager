{% extends "base.html" %}
{% block content %}
  <div class="card animate-in" style="max-width: 520px; margin: 60px auto;">
    <div style="font-size:20px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px;">Forgot Password</div>
    <p class="muted">Enter your username or email to receive a reset link.</p>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="username">Username or Email</label>
        <input id="username" name="username" type="text" required>
      </div>
      <button class="button" type="submit">Send Reset Link</button>
      <a class="button secondary" href="{{ url_for('login') }}">Back to Login</a>
    </form>
  </div>
{% endblock %}
