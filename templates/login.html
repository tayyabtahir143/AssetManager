{% extends "base.html" %}
{% block content %}
  <div class="login-wrap">
    <div class="card login-card">
      <h2>Sign in</h2>
      <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button secondary password-toggle" type="button" data-toggle="#password">Show</button>
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" name="remember_me">
          <span class="muted">Keep me signed in</span>
        </label>
        <button class="button" type="submit">Sign in</button>
      </form>
      <div style="display: flex; justify-content: flex-start; margin-top: 12px;">
        <a class="forgot-button" href="{{ url_for('forgot_password') }}">Forgot password?</a>
      </div>
    </div>
  </div>
  <style>
    .login-wrap {
      display: flex;
      justify-content: center;
      align-items: stretch;
      max-width: 520px;
      margin: 40px auto;
    }
    .login-card {
      max-width: 520px;
      margin: 0 auto;
    }
    .forgot-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      color: var(--accent);
      background: rgba(76, 244, 199, 0.08);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .forgot-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(45, 230, 199, 0.2);
    }
    .password-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .password-row input {
      flex: 1;
    }
    .password-toggle {
      white-space: nowrap;
    }
    @media (max-width: 860px) {
      .login-wrap {
        max-width: 100%;
        padding: 0 16px;
      }
    }
  </style>
  <script>
    document.querySelectorAll('[data-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.querySelector(btn.dataset.toggle);
        if (!target) return;
        target.type = target.type === 'password' ? 'text' : 'password';
        btn.textContent = target.type === 'password' ? 'Show' : 'Hide';
      });
    });
    const usernameInput = document.getElementById('username');
    if (usernameInput) {
      usernameInput.focus();
    }
  </script>
{% endblock %}
