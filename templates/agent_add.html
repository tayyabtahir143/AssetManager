{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div class="page-title">Add Agent</div>
  <div class="page-subtitle">Register a new device. You'll get a config file to deploy on the target machine.</div>
</div>

<div class="card animate-in" style="max-width:500px;">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="name">Agent Name <span class="req">*</span></label>
      <input id="name" name="name" type="text" placeholder="e.g. John's Workstation, Server-01" autofocus required>
      <span class="text-sm muted">A friendly name to identify this device.</span>
    </div>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button class="button" type="submit">Create Agent</button>
      <a class="button secondary" href="{{ url_for('list_agents') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
