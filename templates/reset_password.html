{% extends "base.html" %}
{% block content %}
  <div class="card animate-in" style="max-width: 520px; margin: 60px auto;">
    <div style="font-size:20px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px;">Reset Password</div>
    <p class="muted">Set a new password for your account.</p>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="password">New Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div>
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" required>
      </div>
      <button class="button" type="submit">Update Password</button>
      <a class="button secondary" href="{{ url_for('login') }}">Back to Login</a>
    </form>
  </div>
{% endblock %}
