name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - feature/improvements
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tayyabtahir
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ── Release build (main / master) — tagged :latest ───────────
      - name: Build and push (release)
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            tayyabtahir/assetmanager:latest
            tayyabtahir/assetmanager:${{ github.sha }}
            tayyabtahir/assetmanager:${{ env.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

      # ── Feature / non-release build — tagged :edge, never :latest ─
      - name: Build and push (edge)
        if: env.IS_RELEASE == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            tayyabtahir/assetmanager:edge
            tayyabtahir/assetmanager:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}-edge
