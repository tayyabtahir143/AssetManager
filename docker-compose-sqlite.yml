services:
  init-perms:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/logs && chown -R 65532:65532 /data"]
    volumes:
      - ./data:/data
    restart: "no"
  web:
    image: tayyabtahir/assetmanager:latest
    ports:
      - "5000:5000"
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/inventory.db}
      - SECRET_KEY=change-me
      - TZ=Australia/Brisbane
    depends_on:
      init-perms:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
